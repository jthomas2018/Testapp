[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ytmanager"
version = "0.1.0"
description = "Manage a YouTube channel from the command line"
requires-python = ">=3.9"
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.1",
    "google-auth-httplib2>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ytm = "ytmanager.cli:main"

[tool.setuptools]
packages = ["ytmanager"]
